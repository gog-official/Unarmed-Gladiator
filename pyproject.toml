[project]
name = "gladiator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
    "pygame-gui>=0.6.14",
    "pygame-menu>=4.5.2",
    "pyganim>=0.9.2",
    "pymunk>=7.3.0",
    "pytmx>=3.32",
]

[dependency-groups]
dev = [
    "debugpy",
    "pytest",
    "setuptools",
]

[project.scripts]
dev = "gladiator.main:main"
gen-assets = "gladiator.tools.gen_assets:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
override-dependencies = ["pygame; sys_platform == 'never'"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
